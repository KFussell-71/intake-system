version: '3.8'

services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: intake-system
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2GB
    environment:
      - NEXT_PUBLIC_OLLAMA_MODEL=gemma2:2b
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - NEXT_PUBLIC_SUPABASE_URL=http://kong:8000
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
    env_file:
      - ../app/.env.local
    volumes:
      - fleet_data:/app/data/fleet
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg15
    container_name: intake-db
    restart: always
    # 🏗️ 16TB Hardware Tuning: Increased memory buffers and optimized I/O for SSD/NVMe
    command: [ "postgres", "-c", "max_connections=100", "-c", "shared_buffers=4GB", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=512MB", "-c", "random_page_cost=1.1", "-c", "fsync=on", "-c", "full_page_writes=on" ]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_INITDB_ARGS="--data-checksums"
    secrets:
      - db_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6GB
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d
      - ./data/db:/var/lib/postgresql/data
      - ./data/backups:/var/lib/postgresql/backups

  discovery:
    build:
      context: ./discovery
    container_name: intake-discovery
    restart: always
    network_mode: host # REQUIRED for mDNS/zeroconf broadcasting
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - fleet_data:/app/data/fleet

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: intake-otel
    restart: always
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver

  ollama:
    image: ollama/ollama:latest
    container_name: intake-ollama
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
        limits:
          cpus: '2.0'
          memory: 8GB
    volumes:
      - ollama_data:/root/.ollama

  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    container_name: intake-synapse
    restart: always
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      - ./synapse:/data
    depends_on:
      synapse-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: '2.0'

  synapse-db:
    image: docker.io/postgres:15-alpine
    container_name: synapse-db
    restart: always
    environment:
      - POSTGRES_USER=synapse_user
      - POSTGRES_PASSWORD=vanguard_synapse_secure_pass
      - POSTGRES_DB=synapse
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./data/synapse-db/schemas:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U synapse_user -d synapse" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: '1.0'

  proxy:
    image: nginx:alpine
    container_name: intake-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

  sentry:
    build:
      context: ./sentry
    container_name: intake-phi-sentry
    restart: always
    volumes:
      - app_logs:/app/logs

secrets:
  db_password:
    file: ./secrets/db_password.txt
  gpg_passphrase:
    file: ./secrets/gpg_passphrase.txt

volumes:
  ollama_data:
  fleet_data:
  app_logs:
