events {
    worker_connections 1024;
}

http {
    upstream app_server {
        server app:3000;
    }

    upstream ollama_server {
        server ollama:11434;
    }

    # Rate Limiting Zone: 10 requests per second with burst of 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # App Routing
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://app_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Request-ID $request_id;
            add_header X-Request-ID $request_id;
        }

        # Ollama API Proxy (Internal/Clinical)
        location /api/ai/ {
            proxy_pass http://ollama_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Advanced Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://localhost;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
}
