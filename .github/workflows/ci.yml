name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd app
          npm ci
      
      - name: Prisma Generate
        run: |
          cd app
          npx prisma generate
      
      - name: Run ESLint
        run: |
          cd app
          npm run lint
        continue-on-error: true
      
      - name: Type check
        run: |
          cd app
          npx tsc --noEmit

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd app
          npm ci
      
      - name: Prisma Generate
        run: |
          cd app
          npx prisma generate

      - name: Run tests
        run: |
          cd app
          npm test
        continue-on-error: true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd app
          npm ci
      
      - name: Prisma Generate
        run: |
          cd app
          npx prisma generate
      
      - name: Build
        run: |
          cd app
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_OLLAMA_MODEL: ${{ secrets.NEXT_PUBLIC_OLLAMA_MODEL }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: app/.next
          retention-days: 7

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Production (NAS Hook)
        run: |
          echo "Production deployment initiated for NAS via git-sync"
          # The git-sync container on the NAS will pull this and rebuild
